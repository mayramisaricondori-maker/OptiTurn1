<div class="servicios-screen">

    <header class="servicios-header">
        <button class="app-back-btn" onclick="cargarVista('mapa.html')">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="servicios-title">
            <h2>Servicios</h2>
            <p>Elige el trámite que deseas realizar</p>
        </div>
    </header>

    <section class="establecimiento-resumen">

        <div class="establecimiento-icon">
            <i id="servicioIcono" class="fa-solid fa-id-card"></i>
        </div>

        <div>
            <h3 id="servicioEstablecimiento">RENIEC</h3>
            <p id="servicioDescripcion">Registro de identificación</p>
            <span id="servicioDistancia">A 1.2 km</span>
        </div>

    </section>

    <div class="servicios-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="buscarServicio" placeholder="Buscar servicio o trámite">
    </div>

    <h3 class="section-title">Servicios disponibles</h3>

    <section class="lista-servicios" id="listaServicios"></section>

    <section class="servicio-seleccionado oculto" id="servicioSeleccionadoBox">

        <div>
            <span>Servicio seleccionado</span>
            <h3 id="nombreServicioSeleccionado">Duplicado de DNI</h3>
            <p id="detalleServicioSeleccionado">Atención disponible para el horario actual.</p>
        </div>

        <div class="servicio-metricas">
            <div>
                <i class="fa-solid fa-users"></i>
                <strong id="personasServicio">12</strong>
                <small>Personas</small>
            </div>

            <div>
                <i class="fa-solid fa-clock"></i>
                <strong id="tiempoServicio">35 min</strong>
                <small>Espera</small>
            </div>
        </div>

        <button class="btn-primary" onclick="irACongestion()">
            Visualizar congestión
        </button>

    </section>

    <nav class="bottom-nav">

    <div onclick="cargarVista('dashboard.html')">
        <i class="fa-solid fa-house"></i>
        <span>Inicio</span>
    </div>

    <div class="active" onclick="cargarVista('establecimientos.html')">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Buscar</span>
    </div>

    <div onclick="cargarVista('reservas.html')">
        <i class="fa-solid fa-calendar-days"></i>
        <span>Reservas</span>
    </div>

    <div onclick="cargarVista('perfil.html')">
        <i class="fa-solid fa-user"></i>
        <span>Perfil</span>
    </div>

</nav>

</div>
